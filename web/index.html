<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Final AWS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: white;
        }
        .container h1, .container h2, .container p {
            margin: 10px 0;
        }
        .input-container {
            margin-top: 20px;
        }
        input[type="text"] {
            padding: 10px;
            width: 250px;
            font-size: 16px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .response {
            margin-top: 20px;
            padding: 10px;
            background-color: #e1f7d5;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>IMMUNE</h1>
    <h2>Prueba final de módulo AWS 2410MCDS</h2>
    <p>Jose Marulanda</p>
    
    <p><strong>Prueba de implementación:</strong><br>Para funcionar el despliegue, debe proporcionar el DNI del estudiante. Si existe, podrá ver su información, de lo contrario recibirá un null.</p>
    
    <div class="input-container">
        <input type="text" id="dniInput" placeholder="Ingrese su DNI">
        <input type="submit" value="Enviar" onclick="submitDni()">
    </div>
    
    <div class="response" id="responseContainer">
        <p><strong>Los datos del estudiante son:</strong></p>
        <pre id="responseData"></pre>
    </div>
</div>

<script>
    function submitDni() {
        const dni = document.getElementById('dniInput').value;
        
        if (!dni) {
            alert('Por favor, ingrese un DNI.');
            return;
        }
        
        const requestData = {
            dni: dni
        };

        // Usar la URL proporcionada
        const url = 'https://3jykxu6r5l.execute-api.us-east-1.amazonaws.com/v0';

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestData)
        })
        .then(response => {
            if (!response.ok) {
                // Si la respuesta no es 2xx, muestra el error
                throw new Error('Error en la solicitud: ' + response.status);
            }
            return response.json(); // Asegurarse de que la respuesta sea JSON
        })
        .then(data => {
            const responseContainer = document.getElementById('responseContainer');
            const responseData = document.getElementById('responseData');
            
            // Mostrar los datos obtenidos en el contenedor
            responseData.textContent = JSON.stringify(data, null, 2);
            responseContainer.style.display = 'block';
        })
        .catch(error => {
            // Mostrar el error en la consola y en el alert
            console.error('Error:', error);
            alert('Error al realizar la solicitud: ' + error.message);
        });
    }
</script>

</body>
</html>
